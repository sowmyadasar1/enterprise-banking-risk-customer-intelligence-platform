[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-banking-platform"
version = "0.1.0"
description = "Enterprise Banking Risk & Customer Intelligence Platform"
authors = [
    {name = "Data Engineering Team", email = "data-eng@bank.example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0.20",
    "psycopg2-binary>=2.9.7",
    "alembic>=1.11.3",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.7.0",
    "shap>=0.42.1",
    "lime>=0.2.0",
    "plotly>=5.17.0",
    "streamlit>=1.27.0",
    "dash>=2.13.0",
    "great-expectations>=0.17.15",
    "faker>=19.3.0",
    "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.1",
    "black>=23.9.1",
    "flake8>=6.1.0",
    "mypy>=1.5.1"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
