name: Data Quality Validation

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install great_expectations
          pip install -r requirements.txt
      - name: Run Great Expectations Checkpoints
        run: |
          # Replace with your actual checkpoint name
          great_expectations checkpoint run daily_data_validation_checkpoint
      - name: Post Results Summary
        if: always()
        run: |
          echo "Data Quality Check completed. Please check the logs and Data Docs for details."
